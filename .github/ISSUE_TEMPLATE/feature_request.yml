name: 改进建议 / Feature request
description: 描述要解决的问题和使用场景 / Describe a problem and use case
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决什么问题？ / What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed approach
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案 / Alternatives considered
